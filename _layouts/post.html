---
layout: default
---

<article class="post">
  <p class="post-meta">
    <time>{{ page.date | date: "%-d %B %Y" }}</time>
    · by {{ page.author | default: site.author }}
  </p>

  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.tags %}
    <p class="post-tags"><small>tags: <em>{{ page.tags | join: "</em> · <em>" }}</em></small></p>
  {% endif %}
</article>
