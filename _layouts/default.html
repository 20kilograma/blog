<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">

    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('theme')
            || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var light = document.getElementById('hljs-light');
        var dark = document.getElementById('hljs-dark');
        if (light) light.disabled = theme === 'dark';
        if (dark) dark.disabled = theme !== 'dark';
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text x='50' y='68' font-size='52' font-family='monospace' font-weight='bold' fill='%23fff' text-anchor='middle'>20</text></svg>">

    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <a class="skip-link" href="#main_content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a id="a-title" class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-name">{{ site.title | default: site.github.repository_name }}</span>
        </a>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.4 6.4 4.9 4.9M19.1 19.1l-1.5-1.5M17.6 6.4l1.5-1.5M4.9 19.1l1.5-1.5"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>{{ site.title | default: site.github.repository_name }}</span>
        <span class="footer-mark">@20kilograma</span>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>if (window.hljs) hljs.highlightAll();</script>

    <script>
      (function () {
        var root = document.documentElement;

        function paintChrome(theme) {
          var light = document.getElementById('hljs-light');
          var dark = document.getElementById('hljs-dark');
          if (light) light.disabled = theme === 'dark';
          if (dark) dark.disabled = theme !== 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0b0d' : '#ffffff');
        }

        paintChrome(root.getAttribute('data-theme') || 'light');

        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.addEventListener('click', function () {
            var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', theme);
            paintChrome(theme);
            try { localStorage.setItem('theme', theme); } catch (e) {}
          });
        }

        function markSigil(heading) {
          var walker = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT, null);
          var node;
          while ((node = walker.nextNode())) {
            if (!node.nodeValue.trim()) continue;
            var match = node.nodeValue.match(/^(\s*)(>{1,2})(\s+)/);
            if (!match) return;
            var parent = node.parentNode;
            var sigil = document.createElement('span');
            sigil.className = 'sigil';
            sigil.textContent = match[2];
            parent.insertBefore(sigil, node);
            parent.insertBefore(document.createTextNode(' ' + node.nodeValue.slice(match[0].length)), node);
            parent.removeChild(node);
            return;
          }
        }

        var headings = document.querySelectorAll('#main_content h1, #main_content h2, #main_content h3, #main_content h4');
        Array.prototype.forEach.call(headings, markSigil);

        var paras = document.querySelectorAll('#main_content p');
        Array.prototype.forEach.call(paras, function (p) {
          if (!p.textContent.trim() && p.querySelector('br') && !p.querySelector('img, a, code, pre, iframe')) {
            p.classList.add('is-spacer');
          }
        });
      })();
    </script>
  </body>
</html>
